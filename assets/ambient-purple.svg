<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Yash Nayak — ambient purple network</title>
  <desc id="desc">A calm constellation of softly glowing purple dots connected by fine lines.</desc>
