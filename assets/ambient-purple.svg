<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Yash Nayak | Pixel Universe OS</title>
<desc id="desc">A hand-built pixel-art space workstation in a violet universe, with a terminal window, orbital dots, star field and a tiny robot assistant.</desc>
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080611"/><stop offset=".52" stop-color="#160d2b"/><stop offset="1" stop-color="#090714"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#21133a" stop-opacity=".95"/><stop offset="1" stop-color="#0c0917" stop-opacity=".98"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#7e22ce" stop-opacity=".32"/><stop offset="1" stop-color="#7e22ce" stop-opacity="0"/></radialGradient>
 <pattern id="pixelgrid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#a78bfa" stroke-opacity=".055" stroke-width="1"/></pattern>
 <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="430" rx="16" fill="url(#space)"/><rect width="1200" height="430" rx="16" fill="url(#pixelgrid)"/>
<circle cx="900" cy="170" r="300" fill="url(#nebula)"/><circle cx="240" cy="390" r="180" fill="url(#nebula)" opacity=".65"/>
<!-- tiny pixel stars -->
<g fill="#c4b5fd">
 <rect x="42" y="38" width="4" height="4"/><rect x="118" y="86" width="3" height="3"/><rect x="210" y="28" width="4" height="4"/><rect x="332" y="65" width="3" height="3"/><rect x="448" y="34" width="4" height="4"/><rect x="535" y="91" width="3" height="3"/><rect x="675" y="34" width="3" height="3"/><rect x="780" y="52" width="4" height="4"/><rect x="1112" y="44" width="4" height="4"/><rect x="1150" y="103" width="3" height="3"/><rect x="1062" y="152" width="3" height="3"/><rect x="1002" y="64" width="3" height="3"/><rect x="54" y="235" width="3" height="3"/><rect x="156" y="330" width="4" height="4"/><rect x="410" y="350" width="3" height="3"/><rect x="610" y="298" width="4" height="4"/><rect x="750" y="382" width="3" height="3"/><rect x="1145" y="340" width="4" height="4"/>
 <rect x="180" y="54" width="3" height="3"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></rect><rect x="725" y="110" width="4" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="4.3s" repeatCount="indefinite"/></rect><rect x="1080" y="260" width="3" height="3"><animate attributeName="opacity" values="1;.25;1" dur="5s" repeatCount="indefinite"/></rect>
</g>
<!-- left-side identity panel -->
<rect x="42" y="112" width="500" height="260" rx="8" fill="url(#glass)" stroke="#8b5cf6" stroke-opacity=".72"/>
<path d="M42 148H542" stroke="#8b5cf6" stroke-opacity=".45"/>
<rect x="60" y="126" width="8" height="8" fill="#c084fc"/><rect x="76" y="126" width="8" height="8" fill="#8b5cf6"/><rect x="92" y="126" width="8" height="8" fill="#6d28d9"/>
<text x="116" y="136" font-family="monospace" font-size="12" letter-spacing="1.6" fill="#bda7ff">YASH.OS / PROFILE TERMINAL</text>
<text x="68" y="180" font-family="monospace" font-size="13" fill="#a78bfa">visitor@universe:~$ whoami</text>
<text x="68" y="226" font-family="monospace" font-size="39" font-weight="700" letter-spacing="-1.5" fill="#f5f3ff">Yash Nayak</text>
<text x="68" y="253" font-family="monospace" font-size="13" fill="#d8b4fe">Backend engineer · Security-minded builder</text>
<text x="68" y="289" font-family="monospace" font-size="12" fill="#c4b5fd">[01] ENGINEER  [02] SECURE  [03] AUTOMATE</text>
<text x="68" y="329" font-family="monospace" font-size="13" fill="#a78bfa">visitor@universe:~$ ./build --ship</text>
<rect x="319" y="318" width="8" height="15" fill="#c4b5fd"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
<!-- orbit lines -->
<g fill="none" stroke="#a78bfa" stroke-opacity=".28" stroke-width="1.5"><ellipse cx="862" cy="207" rx="220" ry="92" transform="rotate(-25 862 207)"/><ellipse cx="862" cy="207" rx="178" ry="124" transform="rotate(35 862 207)"/><path d="M650 305L735 245L818 290L895 210L982 252L1074 177L1140 220"/></g>
<!-- pixel planet -->
<g transform="translate(895 105)">
 <rect x="16" y="0" width="32" height="8" fill="#c4b5fd"/><rect x="8" y="8" width="56" height="8" fill="#a78bfa"/><rect x="0" y="16" width="72" height="40" fill="#7c3aed"/><rect x="8" y="56" width="56" height="8" fill="#6d28d9"/><rect x="16" y="64" width="40" height="8" fill="#4c1d95"/>
 <rect x="8" y="24" width="16" height="8" fill="#d8b4fe"/><rect x="32" y="32" width="24" height="8" fill="#a78bfa"/><rect x="16" y="48" width="24" height="8" fill="#5b21b6"/>
 <rect x="-16" y="32" width="24" height="8" fill="#c4b5fd" opacity=".8"/><rect x="64" y="40" width="24" height="8" fill="#c4b5fd" opacity=".8"/>
 <rect x="24" y="-12" width="16" height="8" fill="#a78bfa"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></rect>
</g>
<!-- small satellite -->
<g transform="translate(1080 218)">
 <rect x="12" y="8" width="24" height="24" fill="#c4b5fd"/><rect x="16" y="12" width="16" height="16" fill="#6d28d9"/><rect x="0" y="12" width="12" height="16" fill="#8b5cf6"/><rect x="36" y="12" width="12" height="16" fill="#8b5cf6"/><rect x="20" y="16" width="8" height="8" fill="#f5f3ff" filter="url(#softglow)"/>
 <path d="M24 0V-16M24 40V52" stroke="#c4b5fd" stroke-width="2"/><rect x="20" y="-20" width="8" height="4" fill="#c4b5fd"/><rect x="20" y="52" width="8" height="4" fill="#c4b5fd"/>
</g>
<!-- pixel workstation / robot -->
<g transform="translate(675 265)">
 <rect x="40" y="0" width="100" height="68" rx="3" fill="#25133e" stroke="#8b5cf6" stroke-width="2"/>
 <rect x="48" y="8" width="84" height="50" fill="#090713"/><path d="M58 21H95M58 31H117M58 41H103" stroke="#a78bfa" stroke-width="3" stroke-linecap="square"/><rect x="59" y="47" width="7" height="5" fill="#c4b5fd"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
 <rect x="80" y="68" width="20" height="15" fill="#6d28d9"/><rect x="62" y="82" width="56" height="6" fill="#8b5cf6"/>
 <rect x="0" y="92" width="192" height="10" fill="#6d28d9"/><rect x="16" y="102" width="160" height="7" fill="#4c1d95"/>
 <!-- small robot -->
 <rect x="151" y="46" width="28" height="25" fill="#c4b5fd"/><rect x="155" y="51" width="20" height="14" fill="#7c3aed"/><rect x="158" y="55" width="4" height="4" fill="#f5f3ff"/><rect x="168" y="55" width="4" height="4" fill="#f5f3ff"/><rect x="160" y="68" width="10" height="4" fill="#a78bfa"/><rect x="162" y="38" width="6" height="8" fill="#c4b5fd"/><rect x="163" y="34" width="4" height="4" fill="#e9d5ff"><animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/></rect>
</g>
<!-- footer telemetry -->
<path d="M44 395H1156" stroke="#8b5cf6" stroke-opacity=".28"/><text x="48" y="416" font-family="monospace" font-size="10" letter-spacing="2" fill="#a78bfa">PIXEL UNIVERSE // SYSTEMS THINKING // SECURE BY DESIGN</text><text x="1028" y="416" font-family="monospace" font-size="10" fill="#c4b5fd">SYS: ONLINE</text><circle cx="1015" cy="412" r="3" fill="#c4b5fd" filter="url(#softglow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>